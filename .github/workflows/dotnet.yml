name: .NET

on:
  push:
    branches: [ master, claude/festive-johnson-lqo0h1 ]
  workflow_dispatch:

jobs:
  build:
    env:
      ProjectName: AuthenticatorChooser

    runs-on: windows-latest

    permissions:
      id-token: write   # for Azure OIDC login used by code signing
      contents: read

    strategy:
      matrix:
        include:
          - targetPlatform: win-x64
          - targetPlatform: win-arm64

    steps:
    - name: Unfuck Git
      run: git config set --global core.autocrlf false

    - name: Clone
      uses: actions/checkout@v6
        
    - name: Restore
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build ${{ env.ProjectName }} --no-restore --runtime ${{ matrix.targetPlatform }} --configuration Release --no-self-contained

    - name: Publish
      run: dotnet publish ${{ env.ProjectName }} --no-build --runtime ${{ matrix.targetPlatform }} --configuration Release --no-self-contained -p:PublishSingleFile=true

    # The EXE must be Authenticode-signed by a trusted cert for Windows to grant it the uiAccess privilege
    # (see app.manifest). Mirrors the Azure Key Vault signing flow from pl4nty/winget-extras.
    - name: Azure login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Install AzureSignTool
      run: dotnet tool install --global AzureSignTool

    - name: Sign
      env:
        KEY_VAULT_URL: ${{ secrets.KEY_VAULT_URL }}
        KEY_VAULT_CERT: ${{ secrets.KEY_VAULT_CERT }}
      run: |
        $exe = Get-ChildItem "${{ env.ProjectName }}/bin/Release/net8.0-windows/${{ matrix.targetPlatform }}/publish/*.exe"
        AzureSignTool sign -kvu $env:KEY_VAULT_URL -kvc $env:KEY_VAULT_CERT -kvm -tr http://timestamp.acs.microsoft.com -td sha256 -fd sha256 $exe.FullName

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ProjectName }}-${{ matrix.targetPlatform }}
        path: ${{ env.ProjectName }}/bin/Release/net8.0-windows/${{ matrix.targetPlatform }}/publish/*.exe
        if-no-files-found: error
